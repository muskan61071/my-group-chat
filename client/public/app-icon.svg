<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="App Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="bubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Background Chat Bubble -->
  <g filter="url(#glow)">
    <path d="M160 140 C240 140, 380 140, 380 230 C380 310, 290 320, 230 320 C200 320, 175 330, 140 360 C145 335, 148 315, 140 300 C110 280, 100 240, 100 210 C100 160, 130 140, 160 140 Z" fill="url(#bubble1)" opacity="0.95" />
    
    <!-- Foreground Complementary Chat Bubble -->
    <path d="M352 250 C290 250, 240 280, 240 330 C240 360, 260 385, 290 395 C285 410, 280 420, 260 435 C285 430, 305 420, 320 405 C335 410, 350 410, 365 410 C420 410, 460 380, 460 330 C460 280, 410 250, 352 250 Z" fill="url(#bubble2)" opacity="0.9" />

    <!-- Three Dots inside main bubble -->
    <circle cx="200" cy="230" r="14" fill="#FFFFFF" opacity="0.9" />
    <circle cx="250" cy="230" r="14" fill="#FFFFFF" opacity="0.9" />
    <circle cx="300" cy="230" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
